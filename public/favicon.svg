<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Brand Blue Rounded Container -->
  <rect width="32" height="32" rx="8" fill="#2563EB"/>
  
  <!-- Subtle inner gradient sheen -->
  <rect width="32" height="32" rx="8" fill="url(#brandGrad)" fill-opacity="0.3"/>
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Palm Tree Mark in Pure Crisp White -->
  <g stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0.5, -0.5)">
    <!-- Ground Baseline -->
    <path d="M5 28.5H20.5" stroke-width="2.5" />

    <!-- Trunk -->
    <path d="M8.8 28.5C9.8 23 11 17 12.8 11.5" />
    <path d="M14.5 28.5C14.5 23 14 17 13.8 11.5" />

    <!-- Top-Right Frond -->
    <path d="M13.2 10.5C15.5 6.5 20.5 3 26.5 4.5C24 6.5 21 8.8 17.5 10.5" />

    <!-- Top-Left Frond -->
    <path d="M12.5 10C9.5 6.5 6 4 3 5.5C5.5 7.5 8 9.5 11.5 10.8" />

    <!-- Mid-Left Frond -->
    <path d="M11 11.5C7.5 11.8 4.5 13.5 3.5 17.5C5.8 16 9 14.5 11.8 13.5" />

    <!-- Mid-Right Frond -->
    <path d="M14.5 11C18 11.2 23 12.5 27.5 15.5C24.5 16.5 20.8 16 17.5 14.5" />

    <!-- Low-Right Cascade Frond -->
    <path d="M14 12.5C16.8 14.5 19.5 17.5 20.5 22.5C19.5 20 17.5 17.5 14 15.5" />
  </g>
</svg>
